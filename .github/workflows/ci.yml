name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a test failure is worth far more than the noise it adds.
  RUST_BACKTRACE: 1

jobs:
  # aprsr is expected to run on Windows, macOS and Linux, so it is built and tested on all
  # three rather than on Linux with the others assumed. The job name plus the matrix value
  # produces the check names `Rust (ubuntu-latest)`, `Rust (macos-latest)` and
  # `Rust (windows-latest)`, which is what branch protection matches on — renaming either
  # silently detaches the required checks, so treat them as a published interface.
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: when something is
      # platform-specific, the useful information is precisely which platforms disagree.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version; this action honours it.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Formatting and lints are platform-independent, so they run once rather than three
      # times. Everything below this point genuinely differs per platform.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Release build
        run: cargo build --workspace --release

  # Single-platform on purpose. The frontend build is Node and produces byte-identical
  # output everywhere, and `.gitattributes` pins LF so the staleness check below compares
  # like with like. Running it three times would triple the cost to re-verify a tautology.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      # crates/aprsr-web/static/ is generated but committed, so `cargo run` works without
      # a Node toolchain. If a change to web/ was not rebuilt and committed, the working
      # tree differs here and the build is stale.
      - name: Committed assets are up to date
        run: |
          if ! git diff --exit-code -- crates/aprsr-web/static; then
            echo "::error::crates/aprsr-web/static is stale. Run 'make web' and commit the result."
            exit 1
          fi

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The image is built and *run* rather than only built. A Dockerfile that compiles but
  # produces an image which cannot start — a missing shared library, a data directory the
  # unprivileged user cannot write, a healthcheck that always fails — is exactly the failure
  # a build-only job misses, and it is the failure an operator hits first.
  #
  # Not published anywhere. This gate answers "does it work", not "where do I get it".
  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t aprsr:ci .

      # A configuration good enough to start with, written here rather than committed: the
      # example file deliberately refuses to start until an operator sets a real callsign,
      # and a committed test config that did start would be a config somebody eventually
      # deploys by accident.
      - name: Write a test configuration
        run: |
          mkdir -p ci-data
          cat > ci-aprsr.toml <<'TOML'
          [server]
          id = "T2CI"
          run_dir = "/var/lib/aprsr"

          [database]
          url = "sqlite:///var/lib/aprsr/aprsr.sqlite?mode=rwc"

          [http]
          status_bind = "0.0.0.0:14501"

          [[listen]]
          name = "Clients"
          kind = "igate"
          bind = "0.0.0.0:14580"
          TOML

      - name: The configuration is understood
        run: |
          docker run --rm -v "$PWD/ci-aprsr.toml:/etc/aprsr/aprsr.toml:ro" \
            aprsr:ci check-config --config /etc/aprsr/aprsr.toml

      - name: Start
        run: |
          docker run -d --name aprsr-ci \
            -p 14580:14580 -p 14501:14501 \
            -v "$PWD/ci-aprsr.toml:/etc/aprsr/aprsr.toml:ro" \
            -v aprsr-ci-data:/var/lib/aprsr \
            aprsr:ci

      - name: It becomes healthy
        run: |
          for _ in $(seq 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' aprsr-ci)
            if [ "$state" = "healthy" ]; then
              echo "healthy"
              exit 0
            fi
            if [ "$state" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          echo "::error::the container never became healthy"
          docker logs aprsr-ci
          exit 1

      # The point of the whole job: a client can complete the APRS-IS handshake against the
      # container from outside it.
      - name: A client can log in
        run: |
          response=$(printf 'user N0CALL pass -1 vers ci 0.1 filter t/p\r\n' \
            | timeout 10 nc -q 2 localhost 14580 || true)
          echo "$response"
          echo "$response" | grep -q '^# aprsr' \
            || { echo "::error::no banner from the container"; exit 1; }
          echo "$response" | grep -q 'logresp N0CALL' \
            || { echo "::error::no login response from the container"; exit 1; }

      - name: The dashboard answers
        run: |
          curl -fsS localhost:14501/healthz
          curl -fsS localhost:14501/status.json | grep -q '"id":"T2CI"' \
            || { echo "::error::status.json did not identify the server"; exit 1; }

      # A container that cannot stop cleanly is one an operator learns to `kill -9`, and
      # then every restart drops the station positions that would have been saved.
      - name: It stops cleanly
        run: |
          docker stop --timeout 15 aprsr-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' aprsr-ci)
          docker logs aprsr-ci
          test "$code" = "0" \
            || { echo "::error::exited $code rather than shutting down cleanly"; exit 1; }

      - name: Clean up
        if: always()
        run: docker rm -f aprsr-ci || true
