name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a test failure is worth far more than the noise it adds.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; this action honours it.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Release build
        run: cargo build --workspace --release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      # crates/aprsr-web/static/ is generated but committed, so `cargo run` works without
      # a Node toolchain. If a change to web/ was not rebuilt and committed, the working
      # tree differs here and the build is stale.
      - name: Committed assets are up to date
        run: |
          if ! git diff --exit-code -- crates/aprsr-web/static; then
            echo "::error::crates/aprsr-web/static is stale. Run 'make web' and commit the result."
            exit 1
          fi

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
