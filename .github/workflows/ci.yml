name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a test failure is worth far more than the noise it adds.
  RUST_BACKTRACE: 1

jobs:
  # aprsr is expected to run on Windows, macOS and Linux, so it is built and tested on all
  # three rather than on Linux with the others assumed. The job name plus the matrix value
  # produces the check names `Rust (ubuntu-latest)`, `Rust (macos-latest)` and
  # `Rust (windows-latest)`, which is what branch protection matches on — renaming either
  # silently detaches the required checks, so treat them as a published interface.
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: when something is
      # platform-specific, the useful information is precisely which platforms disagree.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version; this action honours it.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Formatting and lints are platform-independent, so they run once rather than three
      # times. Everything below this point genuinely differs per platform.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Release build
        run: cargo build --workspace --release

  # Single-platform on purpose. The frontend build is Node and produces byte-identical
  # output everywhere, and `.gitattributes` pins LF so the staleness check below compares
  # like with like. Running it three times would triple the cost to re-verify a tautology.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      # crates/aprsr-web/static/ is generated but committed, so `cargo run` works without
      # a Node toolchain. If a change to web/ was not rebuilt and committed, the working
      # tree differs here and the build is stale.
      - name: Committed assets are up to date
        run: |
          if ! git diff --exit-code -- crates/aprsr-web/static; then
            echo "::error::crates/aprsr-web/static is stale. Run 'make web' and commit the result."
            exit 1
          fi

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
